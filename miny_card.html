<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>рџ’Ј РњРёРЅС‹ вЂ” РєР°СЂС‚РѕС‡РєР°</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a12;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .mines-card {
      position: relative;
      width: 100%;
      max-width: 360px;
      border-radius: 26px;
      overflow: hidden;
      cursor: pointer;
    }
    .mines-card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 26px;
    }
  </style>
</head>
<body>
  <div class="mines-card" id="minesCard">
    <img src="mines_card.png" alt="РњРёРЅС‹" id="minesImg">
  </div>

  <script>
    document.getElementById('minesCard').addEventListener('click', function (e) {
      e.stopPropagation();
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'openMines' }, '*');
          return;
        }
      } catch (err) {}
    });
  </script>
</body>
</html>
