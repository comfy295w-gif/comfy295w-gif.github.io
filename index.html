<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NFT Мини-апп</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0f1220;
      --card: #1a1f35;
      --card-border: rgba(255,255,255,0.08);
      --accent: #7c5cff;
      --accent2: #00d4ff;
      --gold: #ffd700;
      --text: #ffffff;
      --muted: #8b91a7;
    }
    html, body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* === Верхняя панель с балансом === */
    .top-bar {
      padding: 14px 16px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .balance {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 40px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .balance:active { transform: scale(0.95); }
    .balance .plus {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
    }
    .stars-icon {
      color: var(--gold);
      font-size: 20px;
    }
    .profile-mini {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    /* === Контент === */
    .main {
      flex: 1;
      padding: 0 16px 90px;
      overflow-y: auto;
    }

    /* Вкладки Игры / Подарки */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .tab {
      flex: 1;
      padding: 12px 0;
      text-align: center;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 20px rgba(124,92,255,0.35);
    }

    /* Карточки игр */
    .game-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px 18px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .game-card:active { transform: scale(0.98); }
    .game-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .game-info { flex: 1; }
    .game-name { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
    .game-desc { font-size: 13px; color: var(--muted); }
    .game-arrow { color: var(--muted); font-size: 20px; }

    .icon-upgrade   { background: linear-gradient(135deg,#ff6b6b,#ff8e53); }
    .icon-mines     { background: linear-gradient(135deg,#38ef7d,#11998e); }
    .icon-arena     { background: linear-gradient(135deg,#a18cd1,#fbc2eb); }
    .icon-contest   { background: linear-gradient(135deg,#f7971e,#ffd200); }

    /* Отступ внизу для панели */
    .spacer { height: 20px; }

    /* === Экран Арены === */
    #arenaScreen { position: fixed; inset: 0; z-index: 200; background: var(--bg); display: flex; flex-direction: column; }
    .arena-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--card-border);
    }
    .arena-header h2 { font-size: 18px; margin: 0; }
    .back-btn {
      background: var(--card); border: 1px solid var(--card-border); color: var(--text);
      width: 36px; height: 36px; border-radius: 12px; font-size: 22px; cursor: pointer;
    }
    .arena-body { flex: 1; padding: 18px 16px; overflow-y: auto; }
    .arena-bank-card {
      background: linear-gradient(135deg, rgba(124,92,255,0.25), rgba(0,212,255,0.2));
      border: 1px solid var(--card-border); border-radius: 20px;
      padding: 24px; text-align: center; margin-bottom: 18px;
    }
    .arena-bank-label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .arena-bank-amount { font-size: 40px; font-weight: 800; color: var(--gold); }
    .arena-bank-sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .arena-players-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
    .arena-players { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 18px; }
    .arena-player {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .arena-player:last-child { border-bottom: none; }
    .arena-player-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      object-fit: cover; background: var(--card-border); flex-shrink: 0;
    }
    .arena-player-name { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .arena-player-bet { font-size: 14px; font-weight: 700; color: var(--gold); }
    .arena-bet-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
    .arena-bet-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .bet-btn {
      background: var(--card); border: 1px solid var(--card-border); color: var(--text);
      padding: 16px 0; border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer;
    }
    .bet-btn.selected { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; }
    .arena-play-btn {
      width: 100%; padding: 16px 0; border: none; border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-size: 17px; font-weight: 700; cursor: pointer;
    }

    /* === Рулетка фортуны === */
    .arena-wheel-wrap { text-align: center; margin-bottom: 16px; position: relative; padding-top: 4px; }
    .wheel-needle {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-top: 20px solid var(--gold);
      z-index: 30; pointer-events: none;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.55));
    }
    .arena-wheel {
      width: 100%; height: 74px; border-radius: 16px;
      background: var(--card); border: 1px solid var(--card-border);
      overflow: hidden; position: relative; display: flex;
      will-change: transform;
    }
    .wheel-seg {
      flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 5px; color: #fff; white-space: nowrap;
      overflow: hidden; padding: 6px 8px; border-right: 2px solid rgba(255,255,255,0.3);
      text-shadow: 0 1px 3px rgba(0,0,0,0.45);
    }
    .wheel-seg .w-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      object-fit: cover; border: 2px solid rgba(255,255,255,0.45);
      background: rgba(0,0,0,0.25); flex-shrink: 0;
    }
    .wheel-seg .w-name {
      max-width: 100px; font-size: 11px; font-weight: 700;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .wheel-seg.winner {
      animation: winnerPulse 0.9s ease-in-out infinite;
    }
    @keyframes winnerPulse {
      0%, 100% { box-shadow: inset 0 0 0 3px var(--gold), 0 0 10px rgba(255,215,0,0.6); }
      50% { box-shadow: inset 0 0 0 3px #fff, 0 0 24px rgba(255,215,0,1); }
    }
    .arena-wheel.glow { box-shadow: 0 0 18px rgba(255,215,0,0.5); }
    .wheel-btn {
      margin-top: 8px; padding: 10px 0; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-weight: 700; font-size: 15px;
    }
    .wheel-result {
      text-align: center; padding: 14px; border-radius: 14px; margin-bottom: 16px;
      background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,140,0,0.2));
      border: 1px solid rgba(255,215,0,0.4); font-weight: 700; font-size: 16px;
    }

    /* === Нижняя панель навигации === */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15,18,32,0.92);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      padding: 10px 6px calc(12px + env(safe-area-inset-bottom));
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
      background: none;
      border: none;
      padding: 4px 0;
    }
    .nav-item .icon { font-size: 22px; line-height: 1; }
    .nav-item.active { color: var(--accent2); }
  </style>
</head>
<body>
  <!-- Верх: баланс + аватар -->
  <div class="top-bar">
    <button class="balance" id="topupBtn"><span class="stars-icon">⭐</span> <span id="balanceValue">0</span> <span class="plus">+</span></button>
    <div class="profile-mini">😎</div>
  </div>

  <!-- Контент -->
  <div class="main">
    <!-- Вкладки -->
    <div class="tabs">
      <div class="tab active" data-tab="games">Игры</div>
      <div class="tab" data-tab="gifts">Подарки</div>
    </div>

    <!-- Игры -->
    <div id="games" class="tab-content">
      <div class="game-card">
        <div class="game-icon icon-upgrade">⬆️</div>
        <div class="game-info">
          <div class="game-name">Апгрейд</div>
          <div class="game-desc">Улучшай и развивай</div>
        </div>
        <div class="game-arrow">›</div>
      </div>

      <div class="game-card">
        <div class="game-icon icon-mines">💣</div>
        <div class="game-info">
          <div class="game-name">Мины</div>
          <div class="game-desc">Угадай, где нет бомб</div>
        </div>
        <div class="game-arrow">›</div>
      </div>

      <div class="game-card" data-open="arena">
        <div class="game-icon icon-arena">⚔️</div>
        <div class="game-info">
          <div class="game-name">Арена (PvP)</div>
          <div class="game-desc">Сражайся с другими игроками</div>
        </div>
        <div class="game-arrow">›</div>
      </div>

      <!-- Конкурсы внизу -->
      <div class="game-card">
        <div class="game-icon icon-contest">🏆</div>
        <div class="game-info">
          <div class="game-name">Конкурсы</div>
          <div class="game-desc">Выигрывай NFT и звёзды</div>
        </div>
        <div class="game-arrow">›</div>
      </div>
      <div class="spacer"></div>
    </div>

    <!-- Подарки (заглушка) -->
    <div id="gifts" class="tab-content" style="display:none;">
      <div style="text-align:center; color:var(--muted); padding:40px 0;">
        🎁 Здесь будут подарки
      </div>
    </div>
  </div>

  <!-- Экран Арены -->
  <div id="arenaScreen" style="display:none;">
    <div class="arena-header">
      <button class="back-btn" id="arenaBack">‹</button>
      <h2>⚔️ Арена</h2>
      <div></div>
    </div>
    <div class="arena-body">
      <div class="arena-bank-card">
        <div class="arena-bank-label">Общий банк</div>
        <div class="arena-bank-amount"><span id="arenaBank">0</span> ⭐</div>
        <div class="arena-bank-sub">Участников: <span id="arenaPlayers">0</span></div>
      </div>

      <!-- Рулетка фортуны -->
      <div class="arena-wheel-wrap" id="arenaWheelWrap">
        <div class="wheel-needle"></div>
        <div class="arena-wheel" id="arenaWheel">
          <div class="wheel-seg" style="background:#ff6b6b;min-width:130px;"> </div>
          <div class="wheel-seg" style="background:#38ef7d;min-width:130px;"> </div>
          <div class="wheel-seg" style="background:#7c5cff;min-width:130px;"> </div>
        </div>
        <div class="wheel-btn" id="wheelSpinLabel">🎰 Крутится...</div>
      </div>
      <div id="wheelResult" class="wheel-result" style="display:none;"></div>

      <div class="arena-players">
        <div class="arena-players-title">Участники</div>
        <div id="arenaPlayersList" style="color:var(--muted);font-size:14px;">Пока никто не поставил</div>
      </div>

      <div class="arena-bet-title">Сделать ставку</div>
      <div class="arena-bet-options">
        <button class="bet-btn" data-bet="100">100</button>
        <button class="bet-btn" data-bet="250">250</button>
        <button class="bet-btn" data-bet="500">500</button>
        <button class="bet-btn" data-bet="1000">1000</button>
      </div>
      <button class="arena-play-btn" id="arenaPlaceBet">🎯 В игру</button>
      <div id="arenaStatus" style="text-align:center;color:var(--muted);font-size:13px;margin-top:12px;"></div>
    </div>
  </div>

  <!-- Нижняя панель -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-section="home">
      <span class="icon">🏠</span>Главная
    </button>
    <button class="nav-item" data-section="tasks">
      <span class="icon">📋</span>Задания
    </button>
    <button class="nav-item" data-section="games">
      <span class="icon">🎮</span>Игры
    </button>
    <button class="nav-item" data-section="profile">
      <span class="icon">👤</span>Профиль
    </button>
  </nav>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Берём баланс из URL (?balance=...), который передал бот
    const params = new URLSearchParams(window.location.search);
    const balanceCount = parseInt(params.get('balance') || '0', 10);
    document.getElementById('balanceValue').textContent = isNaN(balanceCount) ? 0 : balanceCount;

    // Показываем имя пользователя в профиле (уголок)
    try {
      const firstName = tg.initDataUnsafe.user.first_name || 'Игрок';
      document.querySelector('.profile-mini').textContent = (firstName[0] || 'И').toUpperCase();
    } catch (e) {}

    // Переключение вкладок Игры / Подарки
    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        document.getElementById('games').style.display = target === 'games' ? '' : 'none';
        document.getElementById('gifts').style.display = target === 'gifts' ? '' : 'none';
      });
    });

    // Нижняя панель
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        navItems.forEach(n => n.classList.remove('active'));
        item.classList.add('active');
      });
    });

    // Кнопка пополнения звёздами
    const BOT_USERNAME = 'freezegift_bot';
    document.getElementById('topupBtn').addEventListener('click', () => {
      tg.openTelegramLink('https://t.me/' + BOT_USERNAME + '?start=topup');
    });

    // === АРЕНА ===
    // Адрес сервера бота (через ngrok туннель)
    const ARENA_API = 'https://linguist-cloud-manned.ngrok-free.dev/api/arena';
    const USER_ID = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 0;

    let selectedBet = 100;
    let arenaRefreshTimer = null;
    let myUserId = USER_ID;

    // Получаем данные Telegram пользователя
    function getNick() {
      try {
        const u = tg.initDataUnsafe.user;
        return u.first_name || 'Игрок';
      } catch (e) { return 'Игрок'; }
    }

    // Открыть экран арены (правильно — переключаем, сохраняя nav.html)
    function openArenaScreen() {
      document.querySelector('.main').style.display = 'none';
      document.querySelector('.bottom-nav').style.display = 'none';
      document.querySelector('.top-bar').style.display = 'none';
      document.getElementById('arenaScreen').style.display = 'flex';
      refreshArena();
      arenaRefreshTimer = setInterval(refreshArena, 3000);
    }
    function closeArenaScreen() {
      document.getElementById('arenaScreen').style.display = 'none';
      document.querySelector('.main').style.display = '';
      document.querySelector('.bottom-nav').style.display = '';
      document.querySelector('.top-bar').style.display = '';
      if (arenaRefreshTimer) { clearInterval(arenaRefreshTimer); arenaRefreshTimer = null; }
    }

    // Запрос состояния арены
    async function refreshArena() {
      try {
        const res = await fetch(ARENA_API, {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        const data = await res.json();
        document.getElementById('arenaBank').textContent = data.bank || 0;
        document.getElementById('arenaPlayers').textContent = data.players || 0;
        const listEl = document.getElementById('arenaPlayersList');
        const entries = data.roundEntries || data.entries || [];
        if (entries.length > 0) {
          listEl.innerHTML = entries.map((e) =>
            '<div class="arena-player">' +
              '<img class="arena-player-avatar" src="https://t.me/i/userpic/320/' + e.userId + '.jpg" alt="" onerror="this.style.visibility=\'hidden\'">' +
              '<span class="arena-player-name">' + (e.name || e.username || 'Игрок') + '</span>' +
              '<span class="arena-player-bet">' + e.bet + ' ⭐</span>' +
            '</div>'
          ).join('');
        } else {
          listEl.innerHTML = 'Пока никто не поставил';
        }

        renderWheel(data);
        handleWheelStatus(data);
      } catch (e) {
        console.error('refreshArena error', e);
      }
    }

    // === Колёса фортуны ===
    // Цвета секторов рулетки
    const WHEEL_COLORS = ['#ff6b6b', '#38ef7d', '#7c5cff', '#ffd700', '#00d4ff', '#ff8e53', '#a18cd1', '#f38efd'];

    // Лента колеса (порядок участников), которую крутим
    let wheelOffset = 0;      // текущий сдвиг ленты в px
    let wheelTicker = null;   // rAF-цикл непрерывного вращения
    let spinningFlag = false; // идёт ли непрерывное вращение
    let lastTapeKey = '';     // признак, что состав участников не менялся
    let tape = null;          // { html, segW, tapeWidth } построенная лента

    // Строим ленту: несколько повторений списка игроков из фиксированных секторов с аватарками
    function buildTape(players) {
      const segW = 150;
      const reps = Math.max(3, Math.ceil(1600 / (segW * players.length)));
      const seq = [];
      for (let r = 0; r < reps; r++) {
        for (let i = 0; i < players.length; i++) {
          const name = players[i].name || players[i].username || 'Игрок';
          seq.push(
            '<div class="wheel-seg" style="background:' + WHEEL_COLORS[i % WHEEL_COLORS.length] + ';min-width:' + segW + 'px;" data-userid="' + players[i].userId + '">' +
              '<img class="w-avatar" src="https://t.me/i/userpic/320/' + players[i].userId + '.jpg" alt="' + name + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">' +
              '<span class="w-name">' + name + '</span>' +
            '</div>'
          );
        }
      }
      return { html: seq.join(''), segW: segW, tapeWidth: segW * players.length * reps, count: players.length * reps };
    }

    // Отрисовка колеса (перестраиваем ленту только если изменился состав участников)
    function renderWheel(data) {
      const wheel = document.getElementById('arenaWheel');
      const players = (data.roundEntries || data.entries || []).slice(0, 8);
      if (players.length === 0) {
        lastTapeKey = '';
        tape = null;
        wheel.style.transition = 'none';
        wheel.style.transform = '';
        wheel.classList.remove('glow');
        wheel.innerHTML = '<div class="wheel-seg" style="background:#333;min-width:100%;width:100%;color:var(--muted);justify-content:center;">Ждём участников...</div>';
        return;
      }
      const key = players.map((p) => p.userId).join(',');
      if (key !== lastTapeKey) {
        lastTapeKey = key;
        tape = buildTape(players);
        wheel.innerHTML = tape.html;
        stopSpin();
        wheelOffset = 0;
        wheel.style.transition = 'none';
        wheel.style.transform = 'translateX(0)';
      }
    }

    // Непрерывное вращение (симуляция, пока идёт розыгрыш)
    function startSpin() {
      if (spinningFlag || !tape) return;
      spinningFlag = true;
      const wheel = document.getElementById('arenaWheel');
      wheel.classList.remove('glow');
      wheel.style.transition = 'none';
      const speed = 300; // px в секунду
      let last = performance.now();
      const step = (now) => {
        if (!spinningFlag) return;
        const dt = (now - last) / 1000;
        last = now;
        wheelOffset += speed * dt;
        // Крутим по кругу: после почти полного оборота ленты уходим в начало
        if (tape && tape.tapeWidth > 0 && wheelOffset > tape.tapeWidth - 900) {
          wheelOffset -= tape.tapeWidth;
        }
        wheel.style.transform = 'translateX(-' + wheelOffset + 'px)';
        wheelTicker = requestAnimationFrame(step);
      };
      wheelTicker = requestAnimationFrame(step);
    }

    function stopSpin() {
      spinningFlag = false;
      if (wheelTicker) { cancelAnimationFrame(wheelTicker); wheelTicker = null; }
    }

    // Убираем подсветку победителя, если она осталась с прошлого раунда
    function clearWinnerHighlight() {
      const wheel = document.getElementById('arenaWheel');
      const segs = wheel.querySelectorAll('.wheel-seg.winner');
      segs.forEach((s) => s.classList.remove('winner'));
    }

    // Плавно приземляем колесо на победителя (стрелка указывает на его сектор)
    function landOnWinner(data) {
      stopSpin();
      if (!tape) return;
      const roundEntries = (data.roundEntries || data.entries || []).slice(0, 8);
      const idx = roundEntries.findIndex((e) => e.userId === data.winner.userId);
      if (idx < 0) { resetWheel(); return; }
      const wheel = document.getElementById('arenaWheel');
      clearWinnerHighlight();
      const containerWidth = wheel.parentElement.clientWidth || window.innerWidth || 375;
      const seg = tape.segW;
      const Tw = tape.tapeWidth;
      // Лента так, чтобы центр сектора победителя оказался под стрелкой,
      // и сделали ещё 2+ полных оборота относительно текущего положения
      const extra = Math.max(2, Math.ceil((wheelOffset + containerWidth / 2) / Tw) + 2);
      const targetOffset = (extra * Tw + idx * seg + seg / 2) - containerWidth / 2;
      wheel.style.transition = 'transform 2.6s cubic-bezier(0.12, 0.75, 0.2, 1)';
      wheel.style.transform = 'translateX(-' + targetOffset + 'px)';
      wheel.classList.add('glow');

      // Подсвечиваем сектор победителя, который окажется под стрелкой
      const winnerSeg = wheel.children[(extra * roundEntries.length + idx) % tape.count];
      if (winnerSeg) winnerSeg.classList.add('winner');
    }

    function resetWheel() {
      if (!tape) return;
      stopSpin();
      const wheel = document.getElementById('arenaWheel');
      wheel.style.transition = 'none';
      wheel.style.transform = 'translateX(0)';
      wheel.classList.remove('glow');
      wheelOffset = 0;
    }

    // Управление колесом по статусу арены
    function handleWheelStatus(data) {
      const label = document.getElementById('wheelSpinLabel');
      const result = document.getElementById('wheelResult');
      if (data.status === 'spinning') {
        clearWinnerHighlight();
        startSpin();
        label.textContent = '🎰 Фортуна крутится...';
        result.style.display = 'none';
      } else if (data.status === 'done' && data.winner) {
        landOnWinner(data);
        const wName = data.winner.username || data.winner.name || 'Игрок';
        label.textContent = '🎯 Остановился на: ' + wName;
        result.style.display = '';
        result.innerHTML = '🏆 Победитель: <b>' + wName + '</b> забирает весь банк ' + data.lastBank + ' ⭐!';
      } else if (data.status === 'idle') {
        clearWinnerHighlight();
        resetWheel();
        label.textContent = 'Сделай ставку, чтобы начать';
        // Убираем результат через пару секунд после нового раунда
        if (data.players === 0) {
          result.style.display = 'none';
        }
      }
    }

    // Выбор суммы ставки
    document.querySelectorAll('.bet-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.bet-btn').forEach((b) => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedBet = Number(btn.dataset.bet);
      });
    });

    // Кнопка "В игру"
    document.getElementById('arenaPlaceBet').addEventListener('click', async () => {
      const statusEl = document.getElementById('arenaStatus');
      try {
        const res = await fetch(ARENA_API + '/bet', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({
            userId: myUserId,
            bet: selectedBet,
            username: tg.initDataUnsafe.user ? (tg.initDataUnsafe.user.username || '') : '',
            firstName: tg.initDataUnsafe.user ? (tg.initDataUnsafe.user.first_name || '') : ''
          })
        });
        const data = await res.json();
        if (data.ok) {
          statusEl.innerHTML = '✅ Ты в игре на ' + selectedBet + ' ⭐!<br>Баланс: ' + data.balance + ' ⭐';
          document.getElementById('balanceValue').textContent = data.balance;
          refreshArena();
        } else {
          statusEl.innerHTML = '❌ ' + (data.error || 'Ошибка');
        }
      } catch (e) {
        statusEl.innerHTML = '❌ Нет связи с сервером';
      }
    });

    // Переход на экран арены из карточки
    document.querySelectorAll('[data-open="arena"]').forEach((el) => {
      el.addEventListener('click', openArenaScreen);
    });
    document.getElementById('arenaBack').addEventListener('click', closeArenaScreen);
  </script>
</body>
</html>
