<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT Мини-апп</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #fff;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px 20px;
      margin-top: 40px;
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { opacity: 0.9; margin: 0 0 20px; }
    button {
      background: #fff;
      color: #764ba2;
      border: none;
      border-radius: 30px;
      padding: 14px 40px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎁 NFT-подарки мечты</h1>
    <p>Нажмите кнопку, чтобы играть!</p>
    <button id="playBtn">Играть</button>
  </div>

  <script>
    // Инициализация Telegram Web App API
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    document.getElementById('playBtn').addEventListener('click', function() {
      // Пока просто покажем сообщение
      document.querySelector('p').textContent = '🎮 Игра скоро будет!';
      // В будущем здесь будет логика игры
    });
  </script>
</body>
</html>
