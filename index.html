<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NFT Мини-апп</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0f1220;
      --card: #1a1f35;
      --card-border: rgba(255,255,255,0.08);
      --accent: #7c5cff;
      --accent2: #00d4ff;
      --gold: #ffd700;
      --text: #ffffff;
      --muted: #8b91a7;
    }
    html, body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* === Верхняя панель с балансом === */
    .top-bar {
      padding: 14px 16px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .balance {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 40px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .balance:active { transform: scale(0.95); }
    .balance .plus {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
    }
    .stars-icon {
      color: var(--gold);
      font-size: 20px;
    }
    .profile-mini {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    /* === Контент === */
    .main {
      flex: 1;
      padding: 0 16px 90px;
      overflow-y: auto;
    }

    /* Вкладки Игры / Подарки */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .tab {
      flex: 1;
      padding: 12px 0;
      text-align: center;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 20px rgba(124,92,255,0.35);
    }

    /* Карточки игр */
    .game-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px 18px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .game-card:active { transform: scale(0.98); }
    .game-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .game-info { flex: 1; }
    .game-name { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
    .game-desc { font-size: 13px; color: var(--muted); }
    .game-arrow { color: var(--muted); font-size: 20px; }

    .icon-upgrade   { background: linear-gradient(135deg,#ff6b6b,#ff8e53); }
    .icon-mines     { background: linear-gradient(135deg,#38ef7d,#11998e); }
    .icon-arena     { background: linear-gradient(135deg,#a18cd1,#fbc2eb); }
    .icon-contest   { background: linear-gradient(135deg,#f7971e,#ffd200); }

    /* Отступ внизу для панели */
    .spacer { height: 20px; }

    /* === Нижняя панель навигации === */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15,18,32,0.92);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      padding: 10px 6px calc(12px + env(safe-area-inset-bottom));
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
      background: none;
      border: none;
      padding: 4px 0;
    }
    .nav-item .icon { font-size: 22px; line-height: 1; }
    .nav-item.active { color: var(--accent2); }
  </style>
</head>
<body>
  <!-- Верх: баланс + аватар -->
  <div class="top-bar">
    <button class="balance" id="topupBtn"><span class="stars-icon">⭐</span> <span id="balanceValue">0</span> <span class="plus">+</span></button>
    <div class="profile-mini">😎</div>
  </div>

  <!-- Контент -->
  <div class="main">
    <!-- Вкладки -->
    <div class="tabs">
      <div class="tab active" data-tab="games">Игры</div>
      <div class="tab" data-tab="gifts">Подарки</div>
    </div>

    <!-- Игры -->
    <div id="games" class="tab-content">
      <div class="game-card">
        <div class="game-icon icon-upgrade">⬆️</div>
        <div class="game-info">
          <div class="game-name">Апгрейд</div>
          <div class="game-desc">Улучшай и развивай</div>
        </div>
        <div class="game-arrow">›</div>
      </div>

      <div class="game-card">
        <div class="game-icon icon-mines">💣</div>
        <div class="game-info">
          <div class="game-name">Мины</div>
          <div class="game-desc">Угадай, где нет бомб</div>
        </div>
        <div class="game-arrow">›</div>
      </div>

      <div class="game-card">
        <div class="game-icon icon-arena">⚔️</div>
        <div class="game-info">
          <div class="game-name">Арена (PvP)</div>
          <div class="game-desc">Сражайся с другими игроками</div>
        </div>
        <div class="game-arrow">›</div>
      </div>

      <!-- Конкурсы внизу -->
      <div class="game-card">
        <div class="game-icon icon-contest">🏆</div>
        <div class="game-info">
          <div class="game-name">Конкурсы</div>
          <div class="game-desc">Выигрывай NFT и звёзды</div>
        </div>
        <div class="game-arrow">›</div>
      </div>
      <div class="spacer"></div>
    </div>

    <!-- Подарки (заглушка) -->
    <div id="gifts" class="tab-content" style="display:none;">
      <div style="text-align:center; color:var(--muted); padding:40px 0;">
        🎁 Здесь будут подарки
      </div>
    </div>
  </div>

  <!-- Нижняя панель -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-section="home">
      <span class="icon">🏠</span>Главная
    </button>
    <button class="nav-item" data-section="tasks">
      <span class="icon">📋</span>Задания
    </button>
    <button class="nav-item" data-section="games">
      <span class="icon">🎮</span>Игры
    </button>
    <button class="nav-item" data-section="profile">
      <span class="icon">👤</span>Профиль
    </button>
  </nav>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Берём баланс из URL (?balance=...), который передал бот
    const params = new URLSearchParams(window.location.search);
    const balanceCount = parseInt(params.get('balance') || '0', 10);
    document.getElementById('balanceValue').textContent = isNaN(balanceCount) ? 0 : balanceCount;

    // Показываем имя пользователя в профиле (уголок)
    try {
      const firstName = tg.initDataUnsafe.user.first_name || 'Игрок';
      document.querySelector('.profile-mini').textContent = (firstName[0] || 'И').toUpperCase();
    } catch (e) {}

    // Переключение вкладок Игры / Подарки
    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        document.getElementById('games').style.display = target === 'games' ? '' : 'none';
        document.getElementById('gifts').style.display = target === 'gifts' ? '' : 'none';
      });
    });

    // Нижняя панель
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        navItems.forEach(n => n.classList.remove('active'));
        item.classList.add('active');
      });
    });

    // Кнопка пополнения звёздами
    const BOT_USERNAME = 'freezegift_bot';
    document.getElementById('topupBtn').addEventListener('click', () => {
      tg.openTelegramLink('https://t.me/' + BOT_USERNAME + '?start=topup');
    });
  </script>
</body>
</html>
